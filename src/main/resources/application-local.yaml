spring:
  datasource:
    url: jdbc:postgresql://${FIXHUB_DB_HOST:localhost}:${FIXHUB_DB_PORT:5432}/${FIXHUB_DB_NAME:fixhub_db}
    username: ${FIXHUB_DB_USERNAME:fixhub}
    password: ${FIXHUB_DB_PASSWORD:fixhub-local}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${FIXHUB_MAIL_HOST:localhost}
    port: ${FIXHUB_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          timeout: 3000
          connectiontimeout: 5000
          writetimeout: 5000

application:
  frontend-url: ${FIXHUB_FRONTEND_URL:http://localhost:8081}
  admin:
    email: ${FIXHUB_ADMIN_EMAIL:admin@fixhub.com}
    password: ${FIXHUB_ADMIN_PASSWORD:changeme-local-only}

fixhub:
  identity:
    password:
      argon2:
        salt-bytes: 16
        hash-bytes: 32
        parallelism: 1
        memory-kib: 19456
        iterations: 2
        admission:
          max-concurrency: 1
          retry-after-seconds: 1
      blocklist:
        artifact-location: ${FIXHUB_BLOCKLIST_ARTIFACT_LOCATION}
        manifest-location: ${FIXHUB_BLOCKLIST_MANIFEST_LOCATION}
        source-sha256: ${FIXHUB_BLOCKLIST_SOURCE_SHA256}
        artifact-sha256: ${FIXHUB_BLOCKLIST_ARTIFACT_SHA256}
        expected-hibp-entry-count: 100000
        expected-final-entry-count: ${FIXHUB_BLOCKLIST_EXPECTED_FINAL_ENTRY_COUNT}
        version: ${FIXHUB_BLOCKLIST_VERSION}
