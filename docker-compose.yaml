name: fixhub

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: ${FIXHUB_DB_NAME:-fixhub_db}
      POSTGRES_USER: ${FIXHUB_DB_USERNAME:-fixhub}
      POSTGRES_PASSWORD: ${FIXHUB_DB_PASSWORD:-fixhub-local}
    ports:
      - "${FIXHUB_DB_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
          [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
          ]
      interval: 10s
      timeout: 5s
      retries: 5

  mail-dev:
    image: maildev/maildev:2.2.1
    ports:
      - "${FIXHUB_MAIL_UI_PORT:-1080}:1080" # Web UI
      - "${FIXHUB_MAIL_PORT:-1025}:1025" # SMTP Server
    healthcheck:
      test:
        [
        "CMD-SHELL",
        "wget --spider --quiet http://127.0.0.1:1080/healthz || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
